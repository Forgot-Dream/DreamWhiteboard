name: CI

on:
  push:
    branches: [master, "codex/**"]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: dreamwhiteboard_test
          POSTGRES_USER: dreamwhiteboard
          POSTGRES_PASSWORD: test-password-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dreamwhiteboard -d dreamwhiteboard_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: postgres://dreamwhiteboard:test-password-only@localhost:5432/dreamwhiteboard_test?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: 1.26.5
          cache-dependency-path: backend/go.sum
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./... -count=1
      - run: go test -race ./... -count=1

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high

  containers:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
      - name: Validate Compose
        run: docker compose -f deploy/docker-compose.yml --env-file deploy/.env.example config >/dev/null
      - name: Build images
        run: docker compose -f deploy/docker-compose.yml --env-file deploy/.env.example build
      - name: Scan backend image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: dreamwhiteboard-api
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1
      - name: Scan frontend image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: dreamwhiteboard-frontend
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Start clean application stack
        run: docker compose -f deploy/docker-compose.yml --env-file deploy/.env.example up -d --build
      - name: Wait for readiness
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8080/readyz >/dev/null; then exit 0; fi
            sleep 2
          done
          docker compose -f deploy/docker-compose.yml --env-file deploy/.env.example ps
          exit 1
      - name: Run browser collaboration tests
        run: npm run e2e
        working-directory: frontend
        env:
          E2E_BASE_URL: http://127.0.0.1:8080
          E2E_ADMIN_EMAIL: admin@example.com
          E2E_ADMIN_PASSWORD: replace-with-a-unique-12+-character-password
      - name: Collect service logs
        if: failure()
        run: docker compose -f deploy/docker-compose.yml --env-file deploy/.env.example logs --no-color
      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-diagnostics
          path: |
            frontend/test-results
            frontend/playwright-report
          if-no-files-found: ignore
      - name: Stop stack
        if: always()
        run: docker compose -f deploy/docker-compose.yml --env-file deploy/.env.example down -v

  go-vulnerability-scan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: 1.26.5
          cache-dependency-path: backend/go.sum
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...
