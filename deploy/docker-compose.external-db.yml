services:
  postgres:
    profiles: ["bundled-db"]

  api:
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in deploy/.env}
    depends_on: !reset {}
    networks: [backend, postgres_external]

networks:
  postgres_external:
    external: true
    name: ${POSTGRES_NETWORK:?set POSTGRES_NETWORK in deploy/.env}
