name: dreamwhiteboard

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dreamwhiteboard}
      POSTGRES_USER: ${POSTGRES_USER:-dreamwhiteboard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped
    networks: [backend]

  api:
    image: ${API_IMAGE:-dreamwhiteboard-api}
    build:
      context: ../backend
      args:
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
    environment:
      HTTP_ADDR: :8080
      DATABASE_URL: postgres://${POSTGRES_USER:-dreamwhiteboard}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-dreamwhiteboard}?sslmode=disable
      MIGRATIONS_DIR: /app/migrations
      UPLOAD_DIR: /app/uploads
      FIRST_ADMIN_EMAIL: ${FIRST_ADMIN_EMAIL:-}
      FIRST_ADMIN_PASSWORD: ${FIRST_ADMIN_PASSWORD:-}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      SESSION_TTL: ${SESSION_TTL:-168h}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      TRUST_PROXY_HEADERS: "true"
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-26214400}
      MAX_IMAGE_PIXELS: ${MAX_IMAGE_PIXELS:-40000000}
      LOGIN_RATE_LIMIT: ${LOGIN_RATE_LIMIT:-5}
      LOGIN_RATE_WINDOW: ${LOGIN_RATE_WINDOW:-5m}
      WS_AUTH_CHECK_INTERVAL: ${WS_AUTH_CHECK_INTERVAL:-10s}
      ASSET_GC_GRACE: ${ASSET_GC_GRACE:-168h}
      ASSET_GC_INTERVAL: ${ASSET_GC_INTERVAL:-10m}
      ASSET_GC_BATCH_SIZE: ${ASSET_GC_BATCH_SIZE:-100}
      BOARD_UPDATE_RECEIPT_RETENTION: ${BOARD_UPDATE_RECEIPT_RETENTION:-720h}
      BOARD_UPDATE_RECEIPT_CLEANUP_INTERVAL: ${BOARD_UPDATE_RECEIPT_CLEANUP_INTERVAL:-1h}
      BOARD_UPDATE_RECEIPT_CLEANUP_BATCH_SIZE: ${BOARD_UPDATE_RECEIPT_CLEANUP_BATCH_SIZE:-1000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    expose: ["8080"]
    volumes:
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/readyz"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s
    stop_grace_period: 20s
    restart: unless-stopped
    networks: [backend]

  frontend:
    image: ${FRONTEND_IMAGE:-dreamwhiteboard-frontend}
    build:
      context: ../frontend
    ports:
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/frontend-healthz"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks: [backend, edge]

volumes:
  pgdata:
  uploads:

networks:
  backend:
    internal: true
  edge:
